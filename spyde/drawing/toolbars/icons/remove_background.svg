<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Remove Background: a peak sitting ON a sloping background, with the
     background as a bold straight line and a down-arrow for the subtraction.

     Designed for 20 px, not for the artboard. Only about three strokes survive
     at button size, so this deliberately spends them on marks that differ from
     the Fit icon's silhouette: a straight diagonal and an arrow, rather than a
     second curve. The first attempt drew the background as a dashed curve —
     handsome at 150 px, indistinguishable from Fit at 20 px, which was the
     whole complaint. -->
<svg
   width="512"
   height="512"
   viewBox="0 0 512 512"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <g id="layer1">
    <!-- the peak, compact and high so it clears the baseline -->
    <path
       style="fill:none;stroke:#ffffff;stroke-width:38;stroke-linecap:round;stroke-linejoin:round"
       d="M 52,196 C 120,196 140,56 200,56 260,56 280,196 348,196"
       id="peak" />
    <!-- the background: one bold straight slope, well clear of the peak -->
    <path
       style="fill:none;stroke:#ffffff;stroke-width:38;stroke-linecap:round"
       d="M 52,300 L 348,364"
       id="background" />
    <!-- subtraction -->
    <path
       style="fill:none;stroke:#ffffff;stroke-width:38;stroke-linecap:round;stroke-linejoin:round"
       d="M 424,300 L 424,452"
       id="arrow-stem" />
    <path
       style="fill:none;stroke:#ffffff;stroke-width:38;stroke-linecap:round;stroke-linejoin:round"
       d="M 368,396 L 424,456 480,396"
       id="arrow-head" />
  </g>
</svg>
