[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Direct Electron"}]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    # The shared desktop-app shell (asyncio loop, PLOTAPP IPC, log streaming,
    # window/figure registry, action + wizard framework, anyplotlib plotting).
    # The shared shell — its own package (see [tool.uv.sources] below), with
    # the Electron half INSIDE it (de_shell/js), linked into electron/shell.
    "de-shell",
    "numpy>=1.20.0",
    "pillow",
    "matplotlib",
    "scipy",
    "bokeh",
    "scikit-image",
    "sympy",
    "distributed",
    "dask",
    "hyperspy@git+https://github.com/cssfrancis/hyperspy.git@f314cf42aa16a06d82449cd8dc8c8f57df2e3e72",
    # Upstream PyPI rosettasciio (was a cssfrancis fork whose only delta was an
    # MRC-read speed/memory optimisation — see git history). Dropped the fork so
    # the installer no longer needs to git-clone it; large .mrc files just read
    # via the stock memmap path instead of the fork's chunked-run reader. The
    # [hdf5,image] extras cover .hspy / .tif reading (hyperspy pins the same).
    "rosettasciio[hdf5,image]>=0.14.0",
    "pyxem",
    # The Examples menu's datasets. One curated, checksummed, cited collection
    # (grouped by technique, with real acquisition metadata) instead of each
    # analysis library's own fixtures — adding a dataset is a YAML file
    # upstream rather than a loader here. See spyde/backend/example_catalogue.
    #
    # MARKER, not a plain dependency: em-database 0.1.0 declares
    # requires-python >=3.12 while SpyDE supports >=3.10, so depending on it
    # unconditionally makes the whole project unresolvable on 3.10/3.11 — the
    # backend then fails to start at all, taking the app with it. On those
    # versions the Examples menu falls back to Dummy Data only
    # (example_catalogue.available() is False). Drop the marker once upstream
    # relaxes its floor.
    "em-database>=0.2.0; python_version >= '3.12'",
    "imageio-ffmpeg",
    "imagecodecs",
    "psygnal>=0.10.0",
    "anyplotlib>=0.7.1",
    "pyyaml",
    # NOT numexpr. HyperSpy warns "Numexpr is not installed ... which is slower
    # to calculate model" on every model build, but that advice is wrong at
    # spectrum sizes and installing it is a PESSIMISATION: measured on a 1024-
    # channel EELS multifit, 110 spectra/s without it vs 77 with it (best of 3;
    # 70 at 48 threads — numexpr's per-call setup and thread dispatch dominate
    # arrays this small). Do not "fix" the warning by adding it back.
    # GPU-accelerated batched compute (vector orientation mapping, etc.).
    "torch",
    # Remote model registry for the SpotUNet disk detector: pulls upgraded
    # weights + registry.json from Hugging Face (spyde/models/registry.py).
    # A hard dep — without it the documented ship-a-model-without-re-releasing
    # path (spyde/models/registry.py module docstring) silently no-ops.
    "huggingface_hub",
]
description = "DE Visualization tool based on HyperSpy"
dynamic = ["version"]
license = {text = "GPL-3.0-or-later"}
keywords = [
    "EELS",
    "STEM",
    "TEM",
    "hyperspy",
    "microscopy",
    "Cryo EM",
    "4D STEM",
]
name = "spyde"
# Upper bound is load-bearing for the SHIPPED app, not just a courtesy: with an
# open bound uv installs the newest CPython on a fresh machine (it grabbed 3.14),
# for which the CUDA torch wheels (cp310–cp313) don't exist → first-launch
# `uv sync` fails. Cap below 3.14 and ship a `.python-version` (= 3.12) so the
# managed env resolves an interpreter every dependency has wheels for.
requires-python = ">=3.10,<3.14"

[tool.uv]
# When running via the PyCrucible launcher, install only core dependencies —
# never optional extras (tests / doc) which aren't needed at runtime.
extra-index-url = []
# Auto-select the right torch wheel per platform/hardware: CUDA index on
# Windows/Linux with an NVIDIA GPU, CPU wheel otherwise, MPS-capable default
# wheel on macOS arm64. This is what gets the dist build a GPU-enabled torch
# instead of the CPU-only default PyPI wheel. (uv >= 0.5 honours this; the
# `uv pip install --torch-backend=auto` flag is the manual equivalent.)
torch-backend = "auto"

# Explicit PyTorch CUDA wheel index. torch-backend="auto" wasn't selecting CUDA at
# LOCK time on this box (it fell back to the CPU PyPI wheel), so pin torch's source to
# the CUDA index directly — this survives `uv run`'s re-sync. cu124 wheels still ship
# sm_61 (Pascal / TITAN X), so the GPU tile backend works on this dev machine.
# The index is win32-only: it publishes no macOS wheels (CI mac runners must fall
# back to the default PyPI torch), and Linux CI keeps the PyPI wheel it always had.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# The shell is its own repository (de-shell): ONE package, the Python at its
# root and the TypeScript inside it, so both halves of the sidecar protocol
# move together. Until it is on PyPI it is the sibling checkout, editable —
# CI clones it beside the repo, the installer stages its wheel
# (electron/scripts/bundle-python.mjs). Then: a version pin, and this line
# goes.
[tool.uv.sources]
de-shell = { path = "../de-shell", editable = true }
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
]
# anyplotlib is co-developed in the sibling checkout but resolved from PyPI
# (releases track this repo's needs). The report builder needs the 0.4.0 widget/
# layer/inset APIs (shape-widget linewidth, add_layer tint, inset_geometry_change
# dispatch), and the integrating selectors need 0.4.1's widget-side `max_extent`
# to cap the ROI DURING the drag. The floor is >=0.7.1 for three features:
# `Plot3D.set_texture` (0.6.0) paints the 3-D IPF heatmap as a continuous skin
# on the sphere instead of a dense point patch, and `add_key` (0.7.0) pins the
# IPF colour-key triangle over the map as a native overlay — which replaced a
# whole second figure + iframe. Both live in `actions/ipf_view.py` /
# `actions/ipf_window.py`. 0.7.1 makes an EXPORT resolve its pixel tokens: from
# 0.5.0 on, `_sync_for_export` re-pushes every panel from inside the export, and
# under the Electron binary transport that push wrote dangling "\x00bin:" tokens
# into `panel_<id>_json` — so a report cell's `add_layer` overlay shipped with no
# bytes behind it and drew nothing (`report_overlay_tint` / `report_compose`).
# While an unreleased anyplotlib feature is in
# flight, pin a git sha in [project.dependencies] (the hyperspy/rosettasciio
# pattern). When actively editing anyplotlib locally, temporarily re-add the
# editable path override below (do NOT commit it — the path doesn't exist on CI
# runners and breaks `uv sync --frozen`):
# anyplotlib = { path = "../anyplotlib", editable = true }

[tool.pycrucible]
entrypoint = "main.py"

[tool.pycrucible.patterns]
include = [
    "main.py",
    "spyde/**/*.py",
    "spyde/**/*.yaml",
    "spyde/**/*.png",
    "spyde/**/*.ico",
    "spyde/**/*.icns",
    "spyde/**/*.svg",
    "spyde/models/weights/*.pt",
    "spyde/models/weights/registry.json",
]
exclude = [
    ".venv/**/*",
    ".venv2/**/*",
    "**/__pycache__/**",
    ".git/**/*",
    "**/*.pyc",
    "**/*.pyo",
    "**/*.pyd",
    "spyde/tests/**/*",
    "spyde.egg-info/**/*",
    "doc/**/*",
    "examples/**/*",
    "dist/**/*",
]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"

[tool.setuptools.packages.find]
include = ["spyde*", "spyde.*"]
where = ["."]

[tool.setuptools.package-data]
spyde = [
    "*.yaml",
    "*.png",
    "*.ico",
    "*.icns",
    "*.svg",
    "drawing/toolbars/icons/*.svg",
    "models/weights/*.pt",
    "models/weights/registry.json",
    # The CSB plugin's rsciio spec. `"*.yaml"` above only matches spyde/*.yaml —
    # a glob does not cross directories — so without this line the file is
    # absent from a built wheel. Nothing reads it at RUNTIME (csb_format._SPEC
    # mirrors it deliberately), but it is the copy that becomes authoritative
    # the day the plugin moves into rosettasciio, and test_csb_reader.py reads
    # it back to assert the two have not drifted.
    "external/rsciio_csb/*.yaml",
]

[project.optional-dependencies]
tests = [
    "pytest-instafail",
    "pytest-rerunfailures",
    "pytest-split",
    "pytest-timeout",
    "pytest>=3.6",
    "setuptools_scm",
    "pytest-cov",
    "playwright>=1.40.0",
    "sphinx_gallery",
    "tifffile",
]
doc = [
    "sphinx",
    "pydata_sphinx_theme",
    "sphinx-gallery",
    "sphinx_design",
]
# Domain extras (0.3.0). Deliberately NOT core dependencies: each pulls a large
# dependency tree, and the frozen app must stay installable for a user who only
# does 4D-STEM. Actions gate on them with the `requires_package:` toolbar key,
# so a missing extra hides the buttons instead of raising ImportError on click.
# `spyde.data`'s synthetic generators never need them.
eels = ["exspy>=0.3.2"]           # EELS + EDS models, edges, quantification
ebsd = ["kikuchipy>=0.11.0"]      # EBSD signals, IO, detector, master patterns
atoms = ["atomap>=0.4.1"]         # atom finding, sublattices, dumbbells
all = [
    "spyde[eels,ebsd,atoms]",
]

[project.urls]
"Bug Reports" = "https://github.com/directelectron/spyde/issues"
Documentation = "https://directelectron.github.io/spyde/"
Homepage = "https://directelectron.com/"
Support = "https://github.com/directelectron/spyde/discussions"
Source = "https://github.com/directelectron/spyde"

[project.scripts]
spyde = "spyde.__main__:main"

# Registers spyde/hyperspy_extension.yaml so HyperSpy knows the SpyDE signal
# types (e.g. DiffractionVectorsImage). Requires a reinstall to take effect:
# `pip install -e .`
[project.entry-points."hyperspy.extensions"]
spyde = "spyde"

[tool.pytest.ini_options]
# The single canonical Qt-free pytest suite for the Electron/anyplotlib backend.
# (The legacy pytest-qt tests were retired: the dead ones deleted, the unique
# compute/contract nets consolidated here; sped_ag timing lives in benchmark_*.py,
# run manually. The Playwright suite under electron/ covers the UI.)
# The shell's own suite (a Session with no app around it; the boundary test
# that keeps hyperspy/dask/pyxem out of it) runs in the de-shell repo now.
testpaths = ["spyde/tests/migrated"]
addopts = "--strict-markers"
markers = [
    "gpu: tests requiring a physical NVIDIA GPU",
    "slow: slow tests (e.g. real template-library generation)",
    "network: tests that make a live network request (e.g. COD lookup)",
]

# ── Changelog ─────────────────────────────────────────────────────────────────
# towncrier assembles CHANGELOG.rst from one fragment file per PR, written while
# the change is fresh. The alternative — deriving notes from commit subjects at
# release time — reads like a commit log, because that is what it is: it cannot
# say what a change means to someone upgrading, only what the author was doing.
#
# `package` is deliberately unset: this repo's version of record is
# electron/package.json (see prepare_release.yml), not a Python __version__, so
# the version is passed to `towncrier build` explicitly.
[tool.towncrier]
directory        = "upcoming_changes"
filename         = "CHANGELOG.rst"
start_string     = ".. towncrier release notes start\n"
issue_format     = "`#{issue} <https://github.com/directelectron/spyde/pull/{issue}>`_"
title_format     = "{version} ({project_date})"
underlines       = ["=", "-", "~"]

# Behaviour changes lead the notes: they are the entries a reader upgrading has
# to ACT on, and they are easy to miss filed under "Bug Fixes".
[[tool.towncrier.type]]
directory    = "api_change"
name         = "API and Behaviour Changes"
showcontent  = true

[[tool.towncrier.type]]
directory    = "new_feature"
name         = "New Features"
showcontent  = true

[[tool.towncrier.type]]
directory    = "bugfix"
name         = "Bug Fixes"
showcontent  = true

[[tool.towncrier.type]]
directory    = "performance"
name         = "Performance"
showcontent  = true

[[tool.towncrier.type]]
directory    = "deprecation"
name         = "Deprecations"
showcontent  = true

[[tool.towncrier.type]]
directory    = "removal"
name         = "Removals"
showcontent  = true

[[tool.towncrier.type]]
directory    = "doc"
name         = "Documentation"
showcontent  = true

[[tool.towncrier.type]]
directory    = "maintenance"
name         = "Maintenance"
showcontent  = true
