[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "de-autopilot"
version = "0.1.0"
description = "Direct Electron Autopilot — automated acquisition sequencing"
authors = [{name = "Direct Electron"}]
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10,<3.14"

# Same shape as de-groundcrew: the shell plus numpy, and nothing from the
# science stack. packages/de-shell/tests/test_boundary.py is what keeps it so.
dependencies = [
    "de-shell",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
tests = ["pytest>=3.6", "pytest-timeout"]

[tool.setuptools.packages.find]
include = ["de_autopilot*"]
where = ["."]
