<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ground Crew</title>
    <!--
      `blob:` in script-src is load-bearing, not boilerplate. The viewer's figure
      is mounted in a `srcdoc` iframe, and a srcdoc frame INHERITS this policy —
      it does not get a fresh one. anyplotlib boots its widget by turning the
      inlined ESM into a Blob and dynamic-`import()`ing it, so without `blob:`
      the frame renders "Failed to fetch dynamically imported module" and the
      image pane stays black while everything around it looks healthy.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self' data: blob:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
