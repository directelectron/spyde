name: build

# push is main-only: a PR branch already gets the pull_request run; a bare
# `push:` trigger would duplicate every matrix.
on:
  push:
    branches: [main]
  pull_request:
    # Long-lived integration branches too (feat/0.3.0 style): a PR into them
    # must run the tests, not silently run nothing.
    branches: [main, "feat/[0-9]*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The backend is Qt-free (Electron + anyplotlib); no QT_QPA / X11 needed.
  MPLBACKEND: agg
  PYTEST_ADDOPTS: "--timeout=600 -vv --durations=10"

jobs:
  # Two tiers, one job definition: PRs get a reduced 6-leg python matrix, each
  # leg split into 2 duration-balanced shards (12 jobs, ~5-8 min each); pushes
  # to main get the full 3 OS x 4 python matrix, unsharded. group 0 means
  # "no sharding" (falsy in expressions), so `matrix.group &&` selects tier.
  matrix-prep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test: ${{ steps.emit.outputs.test }}
      extras: ${{ steps.emit.outputs.extras }}
    steps:
      # Two tiers: a PR runs a sharded subset, main runs the full cross
      # product. The subset must still cover BOTH non-Linux platforms on an
      # OLD and a NEW Python — a green PR that reddens main on merge is worse
      # than a slower PR, and windows-py3.13 and macos-py3.11 are the legs that
      # have actually caught platform-specific failures the others missed.
      - id: emit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cat >> "$GITHUB_OUTPUT" <<'OUT'
          test<<JSON
          {"include":[
            {"os":"ubuntu-latest","python-version":"3.10","group":1},
            {"os":"ubuntu-latest","python-version":"3.10","group":2},
            {"os":"ubuntu-latest","python-version":"3.11","group":1},
            {"os":"ubuntu-latest","python-version":"3.11","group":2},
            {"os":"ubuntu-latest","python-version":"3.12","group":1},
            {"os":"ubuntu-latest","python-version":"3.12","group":2},
            {"os":"ubuntu-latest","python-version":"3.13","group":1},
            {"os":"ubuntu-latest","python-version":"3.13","group":2},
            {"os":"windows-latest","python-version":"3.12","group":1},
            {"os":"windows-latest","python-version":"3.12","group":2},
            {"os":"windows-latest","python-version":"3.13","group":1},
            {"os":"windows-latest","python-version":"3.13","group":2},
            {"os":"macos-latest","python-version":"3.11","group":1},
            {"os":"macos-latest","python-version":"3.11","group":2},
            {"os":"macos-latest","python-version":"3.13","group":1},
            {"os":"macos-latest","python-version":"3.13","group":2}
          ]}
          JSON
          extras={"group":[1,2]}
          OUT
          else
            cat >> "$GITHUB_OUTPUT" <<'OUT'
          test<<JSON
          {"os":["ubuntu-latest","windows-latest","macos-latest"],
           "python-version":["3.10","3.11","3.12","3.13"],
           "group":[0]}
          JSON
          extras={"group":[0]}
          OUT
          fi

  test:
    name: ${{ matrix.os }}-py${{ matrix.python-version }}${{ matrix.group && format(' (shard {0}/2)', matrix.group) || '' }}
    needs: matrix-prep
    runs-on: ${{ matrix.os }}
    # PR shards run ~5-8 min: 20 is headroom, and a hang costs 20 not 40.
    # Main-tier unsharded legs keep 40 (slowest observed leg ~13 min).
    timeout-minutes: ${{ matrix.group && 20 || 40 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-prep.outputs.test) }}

    steps:
      - uses: actions/checkout@v4
        # Full history + tags so setuptools_scm derives a real version
        # (a shallow checkout has no tags -> 0.0.postN.devN).
        with:
          fetch-depth: 0

      # uv everywhere (project rule). Resolves the git-pinned hyperspy /
      # rosettasciio / anyplotlib forks + the CPU torch wheel from the lock.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pinned: resolving "latest" hits the GitHub releases API, which
          # took out every CI leg during the 2026-07 API outage.
          version: "0.10.11"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # de-shell is a PATH dependency (../de-shell) until it is on PyPI. The
      # runner's workspace parent is writable, so a sibling clone satisfies it
      # — for uv, and for the electron/shell junction the TypeScript jobs need.
      - name: Check out de-shell beside the repo
        shell: bash
        run: test -d ../de-shell || git clone --depth 1 https://github.com/directelectron/de-shell ../de-shell

      - name: Install (locked) + tests extra
        run: uv sync --frozen --extra tests --python ${{ matrix.python-version }}

      - name: Versions
        run: |
          uv run python -V
          uv pip list

      # The single canonical Qt-free suite (testpaths=spyde/tests/migrated).
      # GPU tests skip themselves without CUDA/MPS. No display server required.
      # PR shards split by recorded durations (spyde/tests/.test_durations);
      # pytest-split falls back to count-based splitting when that file is
      # missing or stale, so a missing file degrades balance, not the run.
      # Coverage only on ubuntu-3.12 (the only leg the upload reads); on PRs
      # both shards upload and Codecov merges them server-side.
      - name: Run tests
        # NUMBA_DISABLE_JIT=1 on macOS: the toolchain MISCOMPILES numba kernels
        # there (every python), and the crash lands wherever a jitted kernel
        # runs — most recently inside pyxem's indexation kernels
        # (`_get_full_correlations` under our coarse_seed), as `Fatal Python
        # error: Aborted`. It reads as intermittent only because pytest-split
        # shard composition changes which jitted tests share a process.
        # Interpreting the kernels instead of compiling them cannot miscompile,
        # so this leg trades speed for a correct answer — unlike
        # NUMBA_BOUNDSCHECK, which dodged the crash on the quarry's particle
        # kernels but left them returning WRONG results. macOS is not the
        # wall-clock driver and the shipped app pins 3.12. Remove when a fixed
        # numba/llvmlite lands and these legs run clean without it.
        env:
          NUMBA_DISABLE_JIT: ${{ startsWith(matrix.os, 'macos') && '1' || '0' }}
        run: >
          uv run pytest spyde/tests/migrated
          ${{ matrix.group && format('--splits 2 --group {0} --durations-path spyde/tests/.test_durations', matrix.group) || '' }}
          ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') && '--cov=spyde --cov-report=xml' || '' }}

      - name: Upload coverage to Codecov
        if: ${{ github.repository_owner == 'directelectron'
                && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Domain extras (0.3.0) ──────────────────────────────────────────────────
  # `test` runs with NO optional extras — the `requires_package:` gate must
  # hide EELS/EBSD/atoms actions rather than raise ImportError. This job is
  # the other half: with exspy/kikuchipy/atomap installed the gated code
  # actually executes. One OS / one python; sharded x2 on PRs like `test`.
  test-extras:
    name: extras (ubuntu, py3.12${{ matrix.group && format(', shard {0}/2', matrix.group) || '' }})
    needs: matrix-prep
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.group && 20 || 40 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-prep.outputs.extras) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pinned: resolving "latest" hits the GitHub releases API, which
          # took out every CI leg during the 2026-07 API outage.
          version: "0.10.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # NOT --frozen: the domain extras are not in uv.lock (they are optional
      # and resolve differently per platform), so the lock cannot satisfy them.
      # de-shell is a PATH dependency (../de-shell) until it is on PyPI. The
      # runner's workspace parent is writable, so a sibling clone satisfies it
      # — for uv, and for the electron/shell junction the TypeScript jobs need.
      - name: Check out de-shell beside the repo
        shell: bash
        run: test -d ../de-shell || git clone --depth 1 https://github.com/directelectron/de-shell ../de-shell

      - name: Install with all domain extras
        run: uv sync --extra tests --extra all --python 3.12

      - name: Versions
        run: |
          uv run python -V
          # importlib.metadata, not `pkg.__version__` — atomap exposes no
          # `__version__`. The point is "the extra installed and imports".
          uv run python -c "import importlib.metadata as m; \
            import exspy, kikuchipy, atomap; \
            print('\n'.join(f'{p} {m.version(p)}' \
              for p in ('exspy', 'kikuchipy', 'atomap')))"

      - name: Run tests (extras present)
        run: >
          uv run pytest spyde/tests/migrated
          ${{ matrix.group && format('--splits 2 --group {0} --durations-path spyde/tests/.test_durations', matrix.group) || '' }}

  # ── Renderer/main TypeScript typecheck ─────────────────────────────────────
  # Pure TS compile (tsc --noEmit) of the Electron main + renderer. No Python /
  # display server needed, so it's a fast standalone job that gates the PR.
  typecheck:
    name: electron-typecheck (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # de-shell is a PATH dependency (../de-shell) until it is on PyPI. The
      # runner's workspace parent is writable, so a sibling clone satisfies it
      # — for uv, and for the electron/shell junction the TypeScript jobs need.
      - name: Check out de-shell beside the repo
        shell: bash
        run: test -d ../de-shell || git clone --depth 1 https://github.com/directelectron/de-shell ../de-shell

      # Root install: the root lockfile is the authoritative one, and its
      # postinstall links electron/shell to the shell's TypeScript.
      - name: Install Electron dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: electron
        run: npm run typecheck

  # ── Main-process unit tests (cross-OS) ─────────────────────────────────────
  # Pure-logic units from the Electron MAIN process (node:test, native TS
  # type-stripping on Node 24). No display / Python / Electron runtime. Runs
  # on all desktop OSes because the auto-updater's friendlyError() must
  # sanitise raw error bodies on EVERY platform, and per-OS differences in
  # node --test + type-stripping + glob expansion are real.
  unit:
    name: electron-unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest ≈ Win 11 image; windows-2022 ≈ the older Win 10-era
        # image. macos-latest = Apple Silicon.
        os: [ubuntu-latest, windows-latest, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # de-shell is a PATH dependency (../de-shell) until it is on PyPI. The
      # runner's workspace parent is writable, so a sibling clone satisfies it
      # — for uv, and for the electron/shell junction the TypeScript jobs need.
      - name: Check out de-shell beside the repo
        shell: bash
        run: test -d ../de-shell || git clone --depth 1 https://github.com/directelectron/de-shell ../de-shell

      # Root install: the root lockfile is the authoritative one, and its
      # postinstall links electron/shell to the shell's TypeScript.
      - name: Install Electron dependencies
        run: npm ci

      # From the ROOT: the shell's unit tests, run against the linked tree.
      - name: Run main-process unit tests
        run: npm run test:unit

  # ── Electron e2e (Playwright) ──────────────────────────────────────────────
  # DEFAULT 'electron' project only (synthetic + bundled data, no network);
  # the opt-in real-data 'electron-real' project is NOT run here. ubuntu +
  # xvfb; the app spawns the backend via `uv run python -m spyde`.
  #
  # Duration-balanced slicing, NOT Playwright --shard: --shard balances by
  # FILE COUNT and reliably parks one shard at 2-3x the others (measured 25.8
  # vs 8.0 min on adjacent shards). SLOW_SPECS in electron/playwright.config.ts
  # carries a measured slot-weight per file; SPYDE_E2E_GROUP=k/n bin-packs the
  # slow slice by those weights (fast round-robins — its files are all small).
  # Validation run 2026-08-07: fast groups 7.8-8.7 min wall; slow bins level
  # out near the ~7-min progressive_signal_preview slot, worst ~9 min wall.
  #
  # retries are 0 in CI (playwright.config.ts reads CI) — a retry of a
  # timed-out app boot doubles the damage. Best-effort for now
  # (continue-on-error) until confirmed stable on hosted runners.
  e2e:
    name: electron-e2e (${{ matrix.slice }} ${{ matrix.group }}/${{ matrix.of }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slice: fast, group: 1, of: 4 }
          - { slice: fast, group: 2, of: 4 }
          - { slice: fast, group: 3, of: 4 }
          - { slice: fast, group: 4, of: 4 }
          - { slice: slow, group: 1, of: 6 }
          - { slice: slow, group: 2, of: 6 }
          - { slice: slow, group: 3, of: 6 }
          - { slice: slow, group: 4, of: 6 }
          - { slice: slow, group: 5, of: 6 }
          - { slice: slow, group: 6, of: 6 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pinned: resolving "latest" hits the GitHub releases API, which
          # took out every CI leg during the 2026-07 API outage.
          version: "0.10.11"
          enable-cache: true

      # WITH the domain extras: the `requires_package:` gate hides the
      # EELS/EBSD/atoms actions without them, so those specs cannot pass.
      # NOT --frozen: the extras resolve per-platform (same as `test-extras`).
      # de-shell is a PATH dependency (../de-shell) until it is on PyPI. The
      # runner's workspace parent is writable, so a sibling clone satisfies it
      # — for uv, and for the electron/shell junction the TypeScript jobs need.
      - name: Check out de-shell beside the repo
        shell: bash
        run: test -d ../de-shell || git clone --depth 1 https://github.com/directelectron/de-shell ../de-shell

      - name: Pre-sync the Python backend env
        run: uv sync --extra tests --extra all

      # de-shell is a PATH dependency (../de-shell) until it is on PyPI. The
      # runner's workspace parent is writable, so a sibling clone satisfies it
      # — for uv, and for the electron/shell junction the TypeScript jobs need.
      - name: Check out de-shell beside the repo
        shell: bash
        run: test -d ../de-shell || git clone --depth 1 https://github.com/directelectron/de-shell ../de-shell

      # Root install: the root lockfile is the authoritative one, and its
      # postinstall links electron/shell to the shell's TypeScript.
      - name: Install Electron dependencies
        run: npm ci

      # Electron 42 dropped the postinstall binary download: `npm ci` now leaves
      # node_modules/electron/dist empty and the ~100 MB fetch happens lazily on
      # the first `require('electron')` — which, here, is inside the first spec
      # that launches the app. A slow or failed download would surface as a
      # mystery test timeout instead of an install failure, so pull it here where
      # it can fail loudly on its own line.
      - name: Install the Electron binary
        run: npx install-electron

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Idempotent: on a cache hit the download is skipped; --with-deps still
      # apt-installs the shared libraries either way.
      - name: Install Playwright browsers
        working-directory: electron
        run: npx playwright install --with-deps chromium

      # Example datasets (pyxem's sped_ag) download through pooch with a
      # checksum on first use; three slow-slice specs load it, so uncached
      # runners re-fetch it from Zenodo every run — slow, and a stalled
      # download eats the spec's whole budget (the hyperspy orgs cache the
      # same way, e.g. hyperspy/.github's pooch-cache workflows). Keyed on
      # the lock so a pyxem bump re-saves; restore-keys keeps it warm across
      # unrelated dependency changes (pooch re-verifies checksums on load).
      # ~/.cache/pooch is exspy's GOS databases (42 MB each, Zenodo) — building
      # any EELSCLEdge fetches one on first use, which at Zenodo's ~700 kB/s
      # blows straight through a spec's assertion timeout (eels_edge_component
      # died at 78% of the download). v2 key: the entry now carries both dirs.
      - name: Cache example datasets (pooch)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pyxem
            ~/.cache/pooch
          key: pooch2-pyxem-${{ hashFiles('uv.lock') }}
          restore-keys: pooch2-pyxem-

      # Pay the heavy Zenodo downloads OUTSIDE any spec's timeout budget
      # (no-ops on a warm cache; pooch just re-verifies hashes). Two reasons
      # this is a step of its own: (1) eels_edge_component died at 78% of a
      # GOS download that started inside a 60 s assertion; (2) the dataset
      # cache is saved by whichever shard FINISHES first — usually a fast
      # shard that never loads sped_ag — and a cache key is immutable once
      # saved, so unless every shard prefetches the full set before running,
      # the saved entry is permanently missing the big file. GOS URLs/hashes
      # are read from the installed exspy so a version bump can't go stale.
      - name: Prefetch exspy GOS databases + sped_ag
        run: |
          uv run python -c "
          from exspy._misc.eels import gosh_gos as g
          import pooch
          for src, spec in g._GOSH_SOURCES.items():
              print(src, '->', pooch.retrieve(url=spec['URL'], known_hash=spec['KNOWN_HASH'], progressbar=False))
          import pyxem.data as pxd
          print('sped_ag ->', pxd.sped_ag(allow_download=True, lazy=True))
          "

      - name: Run Electron e2e
        working-directory: electron
        env:
          SPYDE_E2E_SLICE: ${{ matrix.slice }}
          SPYDE_E2E_GROUP: ${{ matrix.group }}/${{ matrix.of }}
        run: xvfb-run --auto-servernum npm run test:build -- --project=electron

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.slice }}-${{ matrix.group }}
          path: electron/playwright-report/
          if-no-files-found: ignore

# NOTE: packaging the desktop app (electron-builder + the uv Python sidecar) is a
# separate, tag-triggered release workflow — see .github/workflows/release.yml. It
# is not wired here because it needs per-OS signing secrets / vendored uv binaries.
