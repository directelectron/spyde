name: build

# push is main-only: a PR branch already gets the pull_request run; the bare
# `push:` trigger duplicated every matrix (2x cost, 2x flake surface).
on:
  push:
    branches: [main]
  pull_request:
    # Long-lived INTEGRATION branches too, not just main. `feat/0.3.0` collects
    # a whole release, and with `[main]` alone a PR into it ran no tests at all
    # — #82 through #88 each landed a wave that way, and the matrix first saw
    # them only when 0.3.0 itself went at main. A PR whose checks are green
    # because nothing ran is worse than a red one.
    branches: [main, "feat/[0-9]*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The backend is Qt-free now (Electron + anyplotlib); no QT_QPA / X11 needed.
  MPLBACKEND: agg
  PYTEST_ADDOPTS: "--timeout=600 -vv --durations=10"

jobs:
  test:
    name: ${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # 30 was too tight once 0.3.0 grew the suite to 2372 tests: legs landed at
    # 28m30s and half the matrix was CANCELLED mid-run at exactly 30m, which
    # reads as a test failure but is a clock. The run is much shorter now (see
    # the coverage note below); this is headroom, and a timeout never reached
    # costs nothing.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        # Full history + tags so setuptools_scm derives a real version
        # (a shallow checkout has no tags -> 0.0.postN.devN).
        with:
          fetch-depth: 0

      # uv everywhere (project rule). Resolves the git-pinned hyperspy /
      # rosettasciio / anyplotlib forks + the CPU torch wheel from the lock.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pinned: resolving "latest" hits the GitHub releases API, which
          # took out every CI leg during the 2026-07 API outage.
          version: "0.10.11"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install (locked) + tests extra
        run: uv sync --frozen --extra tests --python ${{ matrix.python-version }}

      - name: Versions
        run: |
          uv run python -V
          uv pip list

      # The single canonical Qt-free suite (testpaths=spyde/tests/migrated).
      # GPU tests skip themselves without CUDA/MPS. No display server required.
      #
      # Coverage on ONE leg only: the upload below runs solely on
      # directelectron/spyde, so on every fork the other 11 legs wrote a
      # coverage.xml nobody reads. Cost is +45% on a Windows dev box (measured
      # 171s -> 248s over the same 25 files) but only ~15% on a hosted Linux
      # runner (12.5m with vs ~10.8m without, same commit) — so this is tidiness
      # and ~1.5m a leg, NOT the reason the matrix used to time out. That was
      # DaskManager.shutdown() sleeping 0.5s per Session teardown; see
      # test_dask_shutdown_fast.py.
      - name: Run tests
        # NUMBA_BOUNDSCHECK=1 on the legs where numba/llvmlite (0.65.1 AND
        # 0.66.0) MISCOMPILES the particle kernels: cp310/cp311 wheels on every
        # OS, and macOS on every python. Uninstrumented builds corrupt the heap
        # (0xc0000374 / SIGABRT in hull/intensity/contours/instances — wherever
        # the corruption is DETECTED, the corruptor is the compiled kernel);
        # the minimal pair on a Windows py3.11 venv: cold compile crashes,
        # cold compile with boundscheck passes 13/13 with ZERO bounds
        # violations — the kernels' indexing is in-bounds, the instrumented
        # codegen is what dodges the miscompile. The shipped app is unaffected
        # (the payload pins Python 3.12, a clean leg). Remove when a fixed
        # numba lands and these legs run clean without it.
        env:
          NUMBA_BOUNDSCHECK: ${{ (matrix.python-version == '3.10' || matrix.python-version == '3.11' || startsWith(matrix.os, 'macos')) && '1' || '0' }}
        run: uv run pytest spyde/tests/migrated ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') && '--cov=spyde --cov-report=xml' || '' }}

      - name: Upload coverage to Codecov
        if: ${{ github.repository_owner == 'directelectron'
                && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Domain extras (0.3.0) ──────────────────────────────────────────────────
  # The `test` job above runs with NO optional extras, which is the important
  # half of the contract: SpyDE must work for a user who only does 4D-STEM, and
  # the `requires_package:` gate must hide the EELS/EBSD/atoms actions rather
  # than raising ImportError. This job is the other half — with exspy,
  # kikuchipy and atomap installed the gated code actually executes, so a broken
  # EELS/EBSD/atom path fails here instead of silently never running.
  #
  # One OS / one Python: the extras are pure-Python scientific packages and the
  # cross-platform surface is already covered by `test`. Not part of the main
  # matrix because that would quadruple install time for every leg.
  test-extras:
    name: extras (ubuntu, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # NOT --frozen: the domain extras are not in uv.lock (they are optional
      # and resolve differently per platform), so the lock cannot satisfy them.
      - name: Install with all domain extras
        run: uv sync --extra tests --extra all --python 3.12

      - name: Versions
        run: |
          uv run python -V
          # importlib.metadata, not `pkg.__version__` — atomap imports fine but
          # exposes no `__version__`, which failed this job before a single test
          # ran. The point of the step is "the extra installed and imports", so
          # ask the installed distribution, which every package answers.
          uv run python -c "import importlib.metadata as m; \
            import exspy, kikuchipy, atomap; \
            print('\n'.join(f'{p} {m.version(p)}' \
              for p in ('exspy', 'kikuchipy', 'atomap')))"

      - name: Run tests (extras present)
        run: uv run pytest spyde/tests/migrated

  # ── Renderer/main TypeScript typecheck ─────────────────────────────────────
  # Pure TS compile (tsc --noEmit) of the Electron main + renderer. No Python /
  # display server needed, so it's a fast standalone job that gates the PR.
  typecheck:
    name: electron-typecheck (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: electron
        run: npm run typecheck

  # ── Main-process unit tests (cross-OS) ─────────────────────────────────────
  # Pure-logic units from the Electron MAIN process (node:test, native TS type-
  # stripping on Node 24). No display / Python / Electron runtime — just Node — so
  # it runs fast on all three desktop OSes. Motivation: the auto-updater's
  # friendlyError() must sanitise a raw releases.atom / HTML error body on EVERY
  # platform (the "mac auto-update failed spectacularly" wall-of-XML regression,
  # also reported on Windows). The mapper is platform-independent, but running it
  # on windows/macos/ubuntu also guards against per-OS differences in node --test
  # + TS type-stripping + glob expansion.
  unit:
    name: electron-unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest ≈ Win 11 image; windows-2022 ≈ the older Win 10-era image.
        # macos-latest = Apple Silicon. Covers Win 11 / Win 10-era / macOS as asked.
        os: [ubuntu-latest, windows-latest, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Run main-process unit tests
        working-directory: electron
        run: npm run test:unit

  # ── Electron e2e (Playwright) ──────────────────────────────────────────────
  # Runs the DEFAULT 'electron' project only (synthetic + bundled data, no
  # network). The opt-in 'electron-real' project (real pyxem downloads + the
  # screenshot generator) is NOT run here.
  #
  # OS choice: ubuntu-latest + xvfb. Electron headless CI is cheapest/standard on
  # Linux, and the default project uses only synthetic/bundled data (no Windows-
  # specific reader paths exercised). In dev mode the app spawns the backend via
  # `uv run python -m spyde`, so the job sets up uv + pre-syncs the env.
  #
  # Best-effort for now (continue-on-error): the e2e launches a real Electron app
  # + Dask LocalCluster and has not yet been validated green on a hosted runner.
  # Drop continue-on-error once it's confirmed stable in CI.
  # Sharded ×4: the suite is deliberately serial WITHIN a run (one Electron +
  # Dask cluster at a time — see playwright.config.ts), so wall-clock scales
  # only by splitting the spec files across independent runners. Each shard is
  # still fully serial, so the cluster-contention flakiness that forced
  # workers:1 cannot recur across shards (separate VMs). Playwright balances
  # shards by FILE COUNT, not duration — ×2 measured 22.7m vs 10.0m, and ×3
  # still ran 8.1m / 14.5m / >30m (shard 1 was CANCELLED at the timeout on
  # test 76 of 115, so it produced no report at all). ×4 plus the domain
  # extras below brings the worst shard back under the budget.
  e2e:
    name: electron-e2e (ubuntu, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The e2e launches the real Python backend (`uv run python -m spyde`).
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pinned: resolving "latest" hits the GitHub releases API, which
          # took out every CI leg during the 2026-07 API outage.
          version: "0.10.11"
          enable-cache: true

      # WITH the domain extras. Without them the `requires_package:` gate hides
      # every EELS/EBSD/atoms action, so the 0.3.0 specs that click those
      # buttons cannot pass — 9 of them failed for that reason alone, and with
      # retries:1 each one paid a second full app boot. Installing the extras
      # makes them testable AND takes ~10 minutes of dead retry off shard 1.
      # Not --frozen: the extras resolve per-platform, so the lock can't satisfy
      # them (same reason as the `extras` job above).
      - name: Pre-sync the Python backend env
        run: uv sync --extra tests --extra all

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Install Playwright browsers
        working-directory: electron
        run: npx playwright install --with-deps chromium

      # test:build = electron-vite build && playwright test. Pin --project=electron
      # so ONLY the synthetic/bundled-data project runs; without it Playwright runs
      # every project, including the heavy real-data 'electron-real' (pyxem
      # downloads + screenshot writes) that is meant to be opt-in.
      # SPYDE_E2E_SLICE=fast excludes the handful of files that dominate
      # wall-clock (see SLOW_SPECS in playwright.config.ts); they run in the
      # e2e-slow job below. Playwright shards by FILE COUNT, not duration, so
      # without this split one shard reliably lands at 2-4x the others — 127
      # tests in 6.8 min on one against 90 in 22.6 on another, and re-sharding
      # never fixed it because count-balancing keeps making the same choice.
      - name: Run Electron e2e
        working-directory: electron
        env:
          SPYDE_E2E_SLICE: fast
        run: xvfb-run --auto-servernum npm run test:build -- --project=electron --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: electron/playwright-report/
          if-no-files-found: ignore

  # The handful of spec files that dominate wall-clock, split out of the shard
  # matrix above. Playwright balances shards by FILE COUNT, not duration, so
  # leaving these in the matrix reliably parked one shard at 2-4x the others
  # (measured: 127 tests in 6.8 min on shard 3 against 90 in 22.6 on shard 1).
  # Re-sharding does not help — count-balancing keeps making the same split, and
  # the workflow history above records both x2 and x3 landing a shard over
  # 20 min. Moving them here costs no extra wall-clock overall and needs no
  # additional runner beyond this one.
  #
  # The file list lives in ONE place: SLOW_SPECS in electron/playwright.config.ts.
  # `reportSlowTests` prints every file over 30 s, so CI says when it has drifted.
  e2e-slow:
    name: electron-e2e (ubuntu, slow specs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.11"
          enable-cache: true

      - name: Pre-sync the Python backend env
        run: uv sync --extra tests --extra all

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Install Playwright browsers
        working-directory: electron
        run: npx playwright install --with-deps chromium

      - name: Run the slow Electron e2e specs
        working-directory: electron
        env:
          SPYDE_E2E_SLICE: slow
        run: xvfb-run --auto-servernum npm run test:build -- --project=electron

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-slow
          path: electron/playwright-report/
          if-no-files-found: ignore

# NOTE: packaging the desktop app (electron-builder + the uv Python sidecar) is a
# separate, tag-triggered release workflow — see electron/PACKAGING.md. It is not
# wired here because it needs per-OS signing secrets / vendored uv binaries.
