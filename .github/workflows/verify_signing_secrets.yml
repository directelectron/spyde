# Cheap (~1 min) manual check that the macOS signing secrets are VALID and
# round-tripped intact — run this BEFORE cutting a release so a corrupted secret
# (e.g. base64 copied through TextEdit, a mangled multi-line .p8) is caught in
# seconds instead of 15 minutes into a real mac build.
#
# It does NOT build the app or submit anything to Apple. It:
#   1. decodes MAC_CERT_P12_BASE64 → imports the .p12 → confirms a codesigning
#      identity is found (proves the cert + MAC_CERT_PASSWORD are correct),
#   2. writes APPLE_API_KEY_P8 → confirms it's a well-formed PEM private key,
#   3. runs `notarytool history` — a read-only call that AUTHENTICATES against
#      Apple with the API key + key-id + issuer + team-id, proving those four all
#      work together (fails loudly if any is wrong), without submitting a build.
#
# Run: Actions tab → "Verify signing secrets" → Run workflow. Keep this file as
# a pre-release probe — it is also the home of the secret-setup walkthrough below.
#
# ═══════════════════════════════════════════════════════════════════════════════
# HOW THE SIX SECRETS ARE MADE (one-time cert/key setup, done on a Mac)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Signing an Apple app = two required steps since Catalina: (1) CODE-SIGN the
# .app/.dmg/.zip with a Developer ID Application cert, and (2) NOTARIZE (upload
# to Apple, staple the ticket). electron-builder does both during `npm run dist`
# (notarize: true in electron/electron-builder.yml); release.yml's mac leg
# imports the cert + stages the API key, gated on MAC_SIGNING_ENABLED (true when
# MAC_CERT_P12_BASE64 is set — a fork/secret-less run builds UNSIGNED, not red).
#
# Step 1 — Create the certificate. Distributing OUTSIDE the App Store needs a
#   "Developer ID Application" cert — NOT "Mac App Distribution" and NOT
#   "Developer ID Installer" (that one is only for .pkg installers, which SpyDE
#   doesn't ship). Xcode → Settings → Accounts → your Apple ID → Manage
#   Certificates → + → Developer ID Application (or developer.apple.com →
#   Certificates, IDs & Profiles → Certificates → +). Lands the cert + private
#   key in your login keychain.
#
#   Intermediate-chain gotcha: the cert chains up through Apple's CURRENT
#   "Developer ID Certification Authority (G2)" intermediate — NOT the older
#   non-G2 "Developer ID Certification Authority" (being retired; new certs
#   chain to G2):
#       Apple Root CA
#         └─ Developer ID Certification Authority (G2)     ← the intermediate
#              └─ Developer ID Application: You (TEAMID)   ← your signing cert
#   You normally don't pick this by hand, but a CI runner's keychain missing the
#   G2 intermediate shows up as "unable to build chain" / CSSMERR_TP_NOT_TRUSTED.
#   Guard against it by exporting the full chain into the .p12 (Step 2) — and
#   release.yml belt-and-braces fetches
#   https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer into the CI
#   keychain anyway.
#
# Step 2 — Export as .p12 (CI has no keychain). In Keychain Access, Cmd-click
#   BOTH "Developer ID Application: Your Name (TEAMID)" AND "Developer ID
#   Certification Authority (G2)" (download + double-click the G2 .cer first if
#   it isn't shown), right-click → Export … (2 items) → certificate.p12 with an
#   export password. Then: base64 -i certificate.p12 -o certificate.p12.base64
#
# Step 3 — App Store Connect API key (for notarization; preferred over an
#   app-specific password — revocable, no 2FA prompts). appstoreconnect.apple.com
#   → Users and Access → Integrations tab → App Store Connect API → + → role
#   "Developer". DOWNLOAD THE .p8 — you can only download it once. Note the Key
#   ID and (top of that page) the Issuer ID (a UUID). Your Team ID (10 chars) is
#   on developer.apple.com → Membership.
#
# Step 4 — The six repo secrets (Settings → Secrets and variables → Actions):
#
#   | Secret               | Value                                              |
#   |----------------------|----------------------------------------------------|
#   | MAC_CERT_P12_BASE64  | contents of certificate.p12.base64 (Step 2)        |
#   | MAC_CERT_PASSWORD    | the .p12 export password (Step 2)                  |
#   | APPLE_API_KEY_P8     | full contents of the .p8 file (Step 3)             |
#   | APPLE_API_KEY_ID     | the API Key ID (Step 3)                            |
#   | APPLE_API_ISSUER_ID  | the Issuer ID (UUID, Step 3)                       |
#   | APPLE_TEAM_ID        | your 10-char Team ID                               |
#
#   Set the .p8 byte-for-byte (`gh secret set APPLE_API_KEY_P8 < AuthKey_X.p8`)
#   — never through TextEdit; smart-quote substitution mangles PEM keys (the
#   validation below diagnoses exactly that). NB electron-builder wants
#   APPLE_API_KEY as a *file path* — release.yml's "Stage notarization API key"
#   step writes the secret to disk and exports the path.
#
# Verify a published build on any Mac:
#   spctl -a -vvv -t install SpyDE-*.dmg   → "accepted, source=Notarized Developer ID"
#   codesign -dv --verbose=4 /Applications/SpyDE.app  → Authority=Developer ID Application
#   stapler validate SpyDE-*.dmg           → "The validate action worked!"
#   Check the .zip too — it is the auto-update payload and must be notarized, or
#   updates re-trigger Gatekeeper.
name: Verify signing secrets

on:
  workflow_dispatch:

jobs:
  verify:
    name: Verify macOS signing secrets
    runs-on: macos-latest
    env:
      MAC_SIGNING_ENABLED: ${{ secrets.MAC_CERT_P12_BASE64 != '' && 'true' || 'false' }}
    steps:
      - name: Fail fast if secrets are not set
        run: |
          if [ "$MAC_SIGNING_ENABLED" != "true" ]; then
            echo "::error::MAC_CERT_P12_BASE64 is empty — no signing secrets configured."
            exit 1
          fi

      - name: Validate the certificate .p12
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # Decode — a corrupted base64 (TextEdit smart chars / wrapping) fails HERE.
          if ! echo "$MAC_CERT_P12_BASE64" | base64 --decode > cert.p12; then
            echo "::error::MAC_CERT_P12_BASE64 is not valid base64 — re-set it with: base64 -i certificate.p12 | gh secret set MAC_CERT_P12_BASE64"
            exit 1
          fi
          bytes=$(wc -c < cert.p12)
          echo "decoded .p12 is $bytes bytes"
          if [ "$bytes" -lt 500 ]; then
            echo "::error::decoded .p12 is suspiciously small ($bytes bytes) — the base64 is likely truncated/corrupted."
            exit 1
          fi
          # Import into a throwaway keychain and confirm a codesigning identity.
          KEYCHAIN=verify.keychain
          KP=$(openssl rand -base64 24)
          security create-keychain -p "$KP" "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          if ! security import cert.p12 -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign; then
            echo "::error::.p12 import failed — MAC_CERT_PASSWORD is wrong, or the .p12 is corrupted."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          echo "── codesigning identities ──"
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo "::error::no 'Developer ID Application' identity in the .p12 — wrong cert type (need Developer ID Application, not Mac App Distribution / Developer ID Installer)."
            exit 1
          fi
          echo "✓ certificate + password valid; Developer ID Application identity present"
          rm -f cert.p12

      - name: Validate the notarization API key + Apple auth
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.APPLE_API_KEY_P8 }}" > api_key.p8
          # ── STRUCTURAL diagnostics (no key bytes printed) ──────────────────────
          # Describe the SHAPE of the .p8 so we can tell WHAT is malformed without
          # revealing any content. GitHub also masks the secret in logs regardless.
          bytes=$(wc -c < api_key.p8); lines=$(wc -l < api_key.p8)
          echo "p8: $bytes bytes, $lines newline(s)"
          # Header/footer present? (grep -c prints only a count, never the line.)
          hdr=$(grep -c -- "-----BEGIN PRIVATE KEY-----" api_key.p8 || true)
          ftr=$(grep -c -- "-----END PRIVATE KEY-----" api_key.p8 || true)
          echo "has BEGIN header: $([ "$hdr" -ge 1 ] && echo yes || echo NO)"
          echo "has END footer:   $([ "$ftr" -ge 1 ] && echo yes || echo NO)"
          # Any NON-ascii bytes (smart quotes / em-dashes from an editor)?
          if LC_ALL=C grep -qP "[^\x00-\x7F]" api_key.p8 2>/dev/null; then
            echo "contains NON-ASCII bytes: YES  ← an editor replaced -/quotes; re-set from the raw file"
          else
            echo "contains NON-ASCII bytes: no"
          fi
          # Any curly/typographic dash where straight - should be?
          if LC_ALL=C grep -qP "\xe2\x80\x9[0-9a-f]|\xe2\x80\x93|\xe2\x80\x94" api_key.p8 2>/dev/null; then
            echo "contains typographic dashes/quotes: YES  ← TextEdit smart-substitution"
          fi
          # A .p8 is a PEM private key. A mangled one fails openssl.
          if ! openssl pkey -in api_key.p8 -noout 2>/dev/null; then
            echo "::error::APPLE_API_KEY_P8 is not a valid PEM key. See the structural report above. Re-set byte-for-byte with: gh secret set APPLE_API_KEY_P8 < AuthKey_XXXX.p8  (never open the .p8 in TextEdit)."
            exit 1
          fi
          echo "✓ .p8 is a well-formed PEM key"
          echo "Key ID: ${APPLE_API_KEY_ID:0:2}…  Issuer: ${APPLE_API_ISSUER:0:8}…  Team: $APPLE_TEAM_ID"
          # Read-only Apple call that AUTHENTICATES with all four credentials.
          # Succeeds (even with an empty history) only if key+id+issuer are valid.
          if ! xcrun notarytool history \
                --key api_key.p8 \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER" 2>&1 | tee notary.log; then
            echo "::error::notarytool auth FAILED — one of APPLE_API_KEY_P8 / _KEY_ID / _ISSUER_ID is wrong. See the log above."
            exit 1
          fi
          echo "✓ notarization credentials authenticate against Apple"
          rm -f api_key.p8

      - name: Summary
        run: echo "✅ All macOS signing secrets are valid and round-tripped intact. Safe to cut a signed release."
