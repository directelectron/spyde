name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed for gh-pages deployment
  pages: write
  id-token: write

# One lane PER REF, not one lane globally. A bare `pages` group makes every ref
# share a single slot with cancel-in-progress, so any PR pushed while another
# docs build is running CANCELS it — including builds on main. That reported as a
# failed "Build" check on PRs that had nothing wrong with them, and it got worse
# the more branches were in flight. Deploys are unaffected: they only run on main
# (see the deploy step's `if`), which is still a single lane under this key.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # de-shell is a PATH dependency (../de-shell) until it is on PyPI. The
      # runner's workspace parent is writable, so a sibling clone satisfies it
      # — for uv, and for the electron/shell junction the TypeScript jobs need.
      - name: Check out de-shell beside the repo
        shell: bash
        run: test -d ../de-shell || git clone --depth 1 https://github.com/directelectron/de-shell ../de-shell

      # de-shell is a path dependency until it is on PyPI; naming the sibling
      # checkout in the same install lets pip satisfy it.
      - name: Install dependencies and package
        shell: bash
        run: |
          pip install -U -e ../de-shell -e '.[doc]'

      - name: Build documentation
        shell: bash
        run: |
          make -C doc html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/build/html

      # Deploy to GitHub Pages for main branch
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: doc/build/html
          force_orphan: true
