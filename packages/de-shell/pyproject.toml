[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "de-shell"
version = "0.1.0"
description = "Desktop-app shell for the DE application family (SpyDE, Ground Crew, Autopilot)"
authors = [{name = "Direct Electron"}]
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10,<3.14"

# Deliberately tiny. Every dependency added here is one that de-groundcrew and
# de-autopilot must also install — see the module docstring in de_shell/__init__.
# In particular: no hyperspy, no dask, no rosettasciio, no pyxem.
dependencies = [
    "numpy>=1.20.0",
    "anyplotlib>=0.7.1",
    "pyyaml",
]

[project.optional-dependencies]
tests = [
    "pytest>=3.6",
    "pytest-timeout",
]

[tool.setuptools.packages.find]
include = ["de_shell*"]
where = ["."]

[tool.setuptools.package-data]
de_shell = [
    "*.yaml",
    "plotting/toolbars/icons/*.svg",
]
